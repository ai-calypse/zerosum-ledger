spring:
  application:
    name: instrument-service
  jackson:
    # decision: D05-13 — the API is snake_case throughout, matching openapi/instrument-service.yaml. Setting it once
    # beats annotating every response record; AttemptEndpointsIT fails on any mismatch (additionalProperties: false).
    # The provider adapters are unaffected: they carry their own JsonMapper (ProviderHttp), so the wire format we
    # send to FakeCard and FakeBank does not move when this service's API naming changes.
    property-naming-strategy: SNAKE_CASE
  lifecycle:
    # decision: D00-3 — graceful shutdown timeout per master §5.11; Compose stop_grace_period is longer
    timeout-per-shutdown-phase: 30s
  # decision: D00-4, D00-8 — docs/step_00_foundations.md#decisions-and-outputs
  # Runtime queries use instruments_app; Flyway migrates as instruments_owner. Passwords have no defaults (fail fast).
  datasource:
    url: jdbc:postgresql://${ZS_DB_HOST:localhost}:${ZS_DB_PORT:5432}/instruments
    username: instruments_app
    password: ${ZS_INSTRUMENTS_APP_DB_PASSWORD}
  flyway:
    user: instruments_owner
    password: ${ZS_INSTRUMENTS_OWNER_DB_PASSWORD}
    # Tolerate a slow database instead of relying only on Compose start ordering.
    connect-retries: 10
  # decision: D04-2 — docs/step_04_kafka_pipeline.md#decisions-and-outputs (master §5.4 common settings)
  # Copied from ledger-service and order-service rather than varied: every value is stated even where it matches a
  # default, so a framework default cannot change pipeline behaviour silently. The consumer is the instrument-policy
  # consumer (S05-T09); the producer settings are the outbox relay's, which is the only publisher in this service.
  kafka:
    bootstrap-servers: ${ZS_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      # decision: D04-1 — the group id is TopicDefinitions.INSTRUMENT_POLICY_GROUP; stated here too so the deployed
      # consumer and the contract cannot drift apart silently.
      group-id: instrument-policy
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # The relay marks rows published on acknowledgement, so a weaker acks setting would mark money delivered that a
      # broker failover could still lose.
      acks: all
      properties:
        enable.idempotence: true
    listener:
      # MANUAL: offsets are acknowledged by the listener after its transaction commits, never by the container on a
      # timer. An auto-commit could advance past an order whose charge was never created.
      ack-mode: manual
      # One record at a time: policy throughput is not a gate, and per-record handling keeps quarantine attribution
      # exact (D03-6 made the same choice for the same reason).
      type: single

# decision: D05-1 — docs/step_05_instruments_fake_providers.md#decisions-and-outputs
# Provider endpoints and the timeouts that decide when an outcome becomes UNKNOWN rather than merely slow.
zs:
  # decision: D03-4 — static bearer tokens per role (master §5.11), copied from ledger-service. No defaults: a
  # service started without them authenticates nobody, which fails closed rather than open. The values reach the
  # container through docker-compose.yml; they were absent from this service's block until S05-T08 added them, which
  # would have left every /v1 call to the deployed stack failing while the container reported healthy.
  auth:
    writer-tokens: ${ZS_WRITER_TOKENS:}
    reader-token: ${ZS_READER_TOKEN:}
    admin-token: ${ZS_ADMIN_TOKEN:}
  instruments:
    fakecard-base-url: ${ZS_FAKECARD_BASE_URL:http://localhost:8090}
    fakebank-base-url: ${ZS_FAKEBANK_BASE_URL:http://localhost:8090}
    connect-timeout: ${ZS_PROVIDER_CONNECT_TIMEOUT:2s}
    # The read timeout is what turns a slow provider into a resolvable UNKNOWN instead of a parked thread.
    read-timeout: ${ZS_PROVIDER_READ_TIMEOUT:5s}
    # ADR-0010 — a provider without idempotency keys is left alone this long before any resubmission. Must stay
    # above FakeBank's maximum processing delay, or a resubmission could still duplicate a payout.
    quiet-period: ${ZS_PROVIDER_QUIET_PERIOD:60s}
  # decision: D05-3 — the webhook receiver's HMAC secrets (master §5.11, TB2). Same variable and same
  # `current,previous` format as the fake-providers sender reads, because the two sides must agree on the secret
  # exactly: the sender signs with the first, this side accepts either, and that is what lets a rotation happen
  # without restarting both at the same instant. No default — a service started without it verifies no webhook at
  # all, which refuses every delivery rather than accepting every delivery.
  webhooks:
    secrets: ${ZS_WEBHOOK_SECRETS:}
  # decision: D03-5 — the outbox library ships no defaults, so a deployment cannot silently inherit one; every value
  # is stated here. The writer was wired in S05-T07; the relay and the cleanup job started with their first producer
  # in S05-T09, which is the collection policy, and run with exactly these values.
  outbox:
    batch-size: 500
    poll-interval: 50ms
    send-timeout: 10s
    backoff-min: 100ms
    backoff-max: 5s
    retention: 1h
    cleanup-interval: 10m
    cleanup-batch-size: 1000
  # decision: D05-11 — money-movement kill switches. Checked before any submission, never before creation: when a
  # switch is off the attempt is still created, so no order is lost, and it waits in CREATED until the switch is on
  # and the S05-T12 old-CREATED sweep submits it (§0.3 C24). Default enabled, because a stack that came up frozen
  # would look healthy and move no money.
  kill-switches:
    collections-enabled: ${ZS_COLLECTIONS_ENABLED:true}
    # decision: D05-11 — the payouts switch (S05-T10). Independent of collections deliberately: the two paths fail
    # and are frozen separately, which is the whole point of a switch per path. Checked at the START of a run, so a
    # frozen run is refused and creates no attempt — unlike a frozen collection, where the attempt is still created
    # because the money order that caused it cannot be replayed. Nothing is waiting to be sent, so nothing is lost.
    payouts-enabled: ${ZS_PAYOUTS_ENABLED:true}
  # decision: D05-7 — payout runs (S05-T10).
  payouts:
    # M10(c). This value IS the acceptance criterion (docs/zerosum_ledger_mvp_plan.md#must-have): a run refuses when
    # order outbox age + ledger unapplied age + instrument outbox age exceeds it. Changing it changes what M10(c)
    # means, so PayoutFreshnessTest pins it to 5 s.
    freshness-threshold: ${ZS_PAYOUT_FRESHNESS_THRESHOLD:5s}
    # master §5.5 — the smallest credit balance worth a bank transfer. Also the guard that stops a zero or negative
    # payable becoming an attempt, whose amount must be a positive magnitude.
    minimum-payout-minor: ${ZS_MINIMUM_PAYOUT_MINOR:100}
    # The reader APIs a run consults: order-service's outbox stats (D03-7) and the ledger's freshness and balances
    # (D04-5, D02-7). The defaults are host ports for local runs; Compose points them at the containers, because
    # inside the network localhost is this container itself — the same defect class as a localhost broker bootstrap.
    order-base-url: ${ZS_ORDER_BASE_URL:http://localhost:8081}
    ledger-base-url: ${ZS_LEDGER_BASE_URL:http://localhost:8082}
    connect-timeout: ${ZS_PAYOUT_CONNECT_TIMEOUT:2s}
    # Short on purpose: an operator waiting on a hung freshness read learns nothing, and the honest answer after a
    # timeout is to refuse rather than pay against a figure nobody could produce.
    read-timeout: ${ZS_PAYOUT_READ_TIMEOUT:2s}
  # decision: D05-6 — the instrument-policy consumer and the executor its submissions run on.
  policy:
    consumer:
      # Lets a test without a broker run without a listener dialling one; production leaves it true.
      enabled: true
      # decision: D04-4 — how often a paused listener probes its own database pool before resuming. Short enough that
      # a brief restart costs seconds, long enough not to hammer a database that is still down.
      resume-probe-interval: 5s
    # Bounded in both directions: threads cap how many provider calls are outstanding, and the queue caps how far
    # behind the policy may fall before attempts are left in CREATED for the sweeper instead of being queued. An
    # unbounded queue would absorb an outage silently and then replay hours of charges at a provider just recovering.
    submit-threads: 4
    submit-queue: 200

server:
  # decision: D00-3 — docs/step_00_foundations.md#decisions-and-outputs (ports per master §4.6 topology)
  port: 8083

management:
  endpoints:
    web:
      exposure:
        # decision: D00-6 — actuator HTTP exposure limited to health
        include: health
  otlp:
    metrics:
      export:
        # decision: D00-6, D00-7 — Micrometer OTLP push is the single metrics exporter (the agent exports traces only)
        url: ${ZS_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 10s
