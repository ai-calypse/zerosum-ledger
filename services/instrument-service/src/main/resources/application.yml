spring:
  application:
    name: instrument-service
  lifecycle:
    # decision: D00-3 — graceful shutdown timeout per master §5.11; Compose stop_grace_period is longer
    timeout-per-shutdown-phase: 30s
  # decision: D00-4, D00-8 — docs/step_00_foundations.md#decisions-and-outputs
  # Runtime queries use instruments_app; Flyway migrates as instruments_owner. Passwords have no defaults (fail fast).
  datasource:
    url: jdbc:postgresql://${ZS_DB_HOST:localhost}:${ZS_DB_PORT:5432}/instruments
    username: instruments_app
    password: ${ZS_INSTRUMENTS_APP_DB_PASSWORD}
  flyway:
    user: instruments_owner
    password: ${ZS_INSTRUMENTS_OWNER_DB_PASSWORD}
    # Tolerate a slow database instead of relying only on Compose start ordering.
    connect-retries: 10

# decision: D05-1 — docs/step_05_instruments_fake_providers.md#decisions-and-outputs
# Provider endpoints and the timeouts that decide when an outcome becomes UNKNOWN rather than merely slow.
zs:
  instruments:
    fakecard-base-url: ${ZS_FAKECARD_BASE_URL:http://localhost:8090}
    fakebank-base-url: ${ZS_FAKEBANK_BASE_URL:http://localhost:8090}
    connect-timeout: ${ZS_PROVIDER_CONNECT_TIMEOUT:2s}
    # The read timeout is what turns a slow provider into a resolvable UNKNOWN instead of a parked thread.
    read-timeout: ${ZS_PROVIDER_READ_TIMEOUT:5s}
    # ADR-0010 — a provider without idempotency keys is left alone this long before any resubmission. Must stay
    # above FakeBank's maximum processing delay, or a resubmission could still duplicate a payout.
    quiet-period: ${ZS_PROVIDER_QUIET_PERIOD:60s}
  # decision: D03-5 — the outbox library ships no defaults, so a deployment cannot silently inherit one; every value
  # is stated here. Only the writer is wired today (S05-T07): the relay and the cleanup job start with their first
  # producer in S05-T09, and these are the values they will run with.
  outbox:
    batch-size: 500
    poll-interval: 50ms
    send-timeout: 10s
    backoff-min: 100ms
    backoff-max: 5s
    retention: 1h
    cleanup-interval: 10m
    cleanup-batch-size: 1000

server:
  # decision: D00-3 — docs/step_00_foundations.md#decisions-and-outputs (ports per master §4.6 topology)
  port: 8083

management:
  endpoints:
    web:
      exposure:
        # decision: D00-6 — actuator HTTP exposure limited to health
        include: health
  otlp:
    metrics:
      export:
        # decision: D00-6, D00-7 — Micrometer OTLP push is the single metrics exporter (the agent exports traces only)
        url: ${ZS_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 10s
