spring:
  application:
    name: instrument-service
  # decision: D00-4, D00-8 — docs/step_00_foundations.md#decisions-and-outputs
  # Runtime queries use instruments_app; Flyway migrates as instruments_owner. Passwords have no defaults (fail fast).
  datasource:
    url: jdbc:postgresql://${ZS_DB_HOST:localhost}:${ZS_DB_PORT:5432}/instruments
    username: instruments_app
    password: ${ZS_INSTRUMENTS_APP_DB_PASSWORD}
  flyway:
    user: instruments_owner
    password: ${ZS_INSTRUMENTS_OWNER_DB_PASSWORD}
    # Tolerate a slow database instead of relying only on Compose start ordering.
    connect-retries: 10

server:
  # decision: D00-3 — docs/step_00_foundations.md#decisions-and-outputs (ports per master §4.6 topology)
  port: 8083

management:
  endpoints:
    web:
      exposure:
        # decision: D00-6 — actuator HTTP exposure limited to health
        include: health
