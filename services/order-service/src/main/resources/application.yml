spring:
  application:
    name: order-service
  lifecycle:
    # decision: D00-3 — graceful shutdown timeout per master §5.11; Compose stop_grace_period is longer
    timeout-per-shutdown-phase: 30s
  # decision: D00-4, D00-8 — docs/step_00_foundations.md#decisions-and-outputs
  # Runtime queries use orders_app; Flyway migrates as orders_owner. Passwords have no defaults (fail fast).
  datasource:
    url: jdbc:postgresql://${ZS_DB_HOST:localhost}:${ZS_DB_PORT:5432}/orders
    username: orders_app
    password: ${ZS_ORDERS_APP_DB_PASSWORD}
  flyway:
    user: orders_owner
    password: ${ZS_ORDERS_OWNER_DB_PASSWORD}
    # Tolerate a slow database instead of relying only on Compose start ordering.
    connect-retries: 10

orders:
  store:
    # decision: D03-3 — docs/step_03_order_service_outbox.md#decisions-and-outputs
    # Bound on waiting for a concurrent transaction that holds the same idempotency key. The master's cross-cutting
    # lock_timeout is 2s; exceeding it returns 409 idempotency_key_in_progress rather than holding the request open.
    lock-timeout: 2s

# decision: D03-4 — docs/step_03_order_service_outbox.md#decisions-and-outputs
# Static bearer tokens per role (master §5.11). No defaults: a service started without them authenticates nobody.
  # decision: D03-2 — TB1 request parsing. Unknown fields are rejected rather than ignored, so a body carrying a
  # server-assigned field (order_id, source, created_at) fails instead of appearing to have set it. Duplicate keys are
  # rejected so the hashed request cannot be ambiguous, and a float or string is never coerced into an integer amount.
  # decision: D03-5 — docs/step_03_order_service_outbox.md#decisions-and-outputs
  # Provisional until S04-T01 records D04-2. Master platform-limits requires these to be explicit rather than
  # inherited: acks=all so a send is acknowledged only once every in-sync replica holds the record, and idempotence so
  # a producer retry cannot duplicate within its own session. The relay marks rows published on acknowledgement, so a
  # weaker acks setting would mark money delivered that a broker failover could still lose.
  kafka:
    producer:
      acks: all
      properties:
        enable.idempotence: true
  jackson:
    deserialization:
      # Unknown fields are rejected rather than ignored, so a body carrying a server-assigned order_id, source or
      # created_at fails instead of appearing to have set it.
      fail-on-unknown-properties: true
    read:
      # Boot 4.1 binds StreamReadFeature under spring.jackson.read, not spring.jackson.parser: the old key name bound
      # to nothing at all, and duplicate keys were silently accepted. A duplicate key would make the hashed request
      # ambiguous (D03-3).
      strict-duplicate-detection: true

zs:
  outbox:
    batch-size: 500
    poll-interval: 50ms
    send-timeout: 10s
    backoff-min: 100ms
    backoff-max: 5s
    retention: 1h
    cleanup-interval: 10m
    cleanup-batch-size: 1000
  auth:
    writer-tokens: ${ZS_WRITER_TOKENS:}
    reader-token: ${ZS_READER_TOKEN:}
    admin-token: ${ZS_ADMIN_TOKEN:}

server:
  # decision: D00-3 — docs/step_00_foundations.md#decisions-and-outputs (ports per master §4.6 topology)
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # decision: D00-6 — actuator HTTP exposure limited to health
        include: health
  otlp:
    metrics:
      export:
        # decision: D00-6, D00-7 — Micrometer OTLP push is the single metrics exporter (the agent exports traces only)
        url: ${ZS_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 10s
