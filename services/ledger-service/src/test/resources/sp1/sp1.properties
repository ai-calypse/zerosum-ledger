# decision: D02-10 — docs/step_02_ledger_core.md#decisions-and-outputs
# SP1 lock study parameters. Every value comes from the master and is never restated in an assertion or in the report
# text: the runner reads them here and the report copies this file.
#
#   writers, question and criterion      docs/zerosum_ledger_mvp_plan.md#spikes
#   window duration and repetitions      docs/zerosum_ledger_mvp_plan.md#perf-tests  (3 min each x 3)
#   warm-up before every measured window docs/zerosum_ledger_mvp_plan.md#cold-warm   (2 min at the test rate)
#
# The study runs per-order mode (batch size 1) with every generated order touching platform:main, against a database
# configured as D00-3 describes with durability intact. Relaxing fsync would make the result a smoke check, not SP1 data.

writers=1,4,12,32
windowSeconds=180
warmupSeconds=120
repetitions=3

# Orders are pre-generated before each window so the client is never the bottleneck. This is the size of the
# pre-generated pool per window; the runner cycles it if a window outlasts the pool.
payloadPoolSize=200000

# Distinct riders and drivers in the generated workload. platform:main is in every order by construction, which is the
# hot entity the study is about.
riderPool=2000
driverPool=500
