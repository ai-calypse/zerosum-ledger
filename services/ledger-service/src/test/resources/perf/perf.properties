# decision: D07-5, D07-6 — docs/step_07_observability_performance.md#s07-t05, #s07-t06
# S07-T04/T05/T06 performance study parameters. Every value is read here and copied into the report, never restated
# in an assertion, so the report and the runner cannot disagree.
#
#   windows, repetitions, variance rule    docs/zerosum_ledger_mvp_plan.md#perf-tests
#   warm-up before every measured window   docs/zerosum_ledger_mvp_plan.md#cold-warm
#   the ESTIMATES under test               docs/zerosum_ledger_mvp_plan.md#bottlenecks
#   shard emulation (option b)             docs/step_07_observability_performance.md#s07-t04 instruction 2
#
# DEVIATION FROM THE MASTER MATRIX, stated here so the report copies it rather than inventing a justification:
# the master's perf matrix is a 180 s window after a 120 s warm-up, x3. This study uses a 45 s window after a 20 s
# warm-up, x3, because the batch and entity grids are 36 windows rather than SP1's 12, and the full-size matrix would
# be over six hours of machine time. Repetitions and the median-of-repetitions reporting rule are NOT reduced.
# Every number this harness writes is labelled with the window it was measured over.

windowSeconds=45
warmupSeconds=20
repetitions=3

# Pre-generated payload shapes per window, so the client never builds JSON inside a measured window. Each submission
# stamps a fresh order id into a pre-rendered shape (two string concatenations), so cycling the pool still produces a
# genuinely new order every time and never a duplicate. A window in which any submission came back DUPLICATE is not a
# data point.
payloadPoolSize=20000

# Distinct riders and drivers, as in SP1, so the only thing that changes between this study and SP1 is the variable
# under test. docs/results/sp1-lock-study.md
riderPool=2000
driverPool=500

# --------------------------------------------------------------------------------------------------------------------
# Measurement 1 — batched versus per-order apply (tests the ~5,000 orders/s batched ESTIMATE).
# Writer counts are two of SP1's four, so batchSizes=1 reproduces SP1 at both ends of its range and the harness
# validates itself against an independently measured result before any new claim rests on it.
# --------------------------------------------------------------------------------------------------------------------
batchSizes=1,10,50,100
batchWriters=1,32

# --------------------------------------------------------------------------------------------------------------------
# Measurement 2 — throughput across N distinct platform entities (workload-level emulation of option (b) sharding).
# Per-order mode at SP1's ceiling writer count, so entityCounts=1 is SP1's exact scenario and the rest of the curve is
# the same measurement with the hot entity spread wider.
# --------------------------------------------------------------------------------------------------------------------
entityCounts=1,10,100,1000
entityWriters=32
entityBatchSize=1

# --------------------------------------------------------------------------------------------------------------------
# Measurement 3 — end-to-end latency across the real outbox -> Kafka -> apply path.
# Rates are the P2 gate rate and the T1 sustained-throughput rate from docs/zerosum_ledger_mvp_plan.md#go-no-go.
# --------------------------------------------------------------------------------------------------------------------
e2eRates=200,500
e2eAppenders=4
e2eWindowSeconds=60
e2eWarmupSeconds=30

# An arrival that starts this many milliseconds after its scheduled time is counted late. A window with late arrivals
# above e2eMaxLatePercent did not hold its open-model arrival rate and is not a latency result (S07-T04 edge cases:
# "dropped iterations above zero mean the load generator couldn't hold the arrival rate").
e2eLateThresholdMillis=50
e2eMaxLatePercent=1
