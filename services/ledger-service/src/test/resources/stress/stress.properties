# decision: D02-11 — docs/step_02_ledger_core.md#decisions-and-outputs
# Concurrency stress parameters. The full size is the database-integration row of
# docs/zerosum_ledger_mvp_plan.md#test-layers (32 threads x 20k orders, 30% duplicates); the pull-request size is
# reduced so the integration job stays inside the <= 10 min target of docs/zerosum_ledger_mvp_plan.md#cicd.
# Select with -Pzs.stress.size=full|pr (default: pr). Assertions never hard-code these values.

full.threads=32
full.orders=20000
full.duplicatePercent=30

pr.threads=8
pr.orders=2000
pr.duplicatePercent=30

# Batched mode submits this many records per apply call; per-order mode always uses 1.
batchSize=25
# The zero-sum sampler reads the global per-currency sum this often while writers run (M5 c).
samplerIntervalMillis=20
# Trip generator inputs (D01-10): commission in basis points and the share of trips that get a fare adjustment.
commissionBps=2000
adjustmentPercent=20
# Share of orders whose platform commission is split into two entries, so an entity repeats across entries (C4).
platformSplitPercent=20
