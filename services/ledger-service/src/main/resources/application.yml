spring:
  application:
    name: ledger-service
  jackson:
    # decision: D02-7 — the read API is snake_case throughout, matching openapi/ledger-service.yaml. Setting it once
    # beats annotating every response record; LedgerOpenApiContractIT fails on any mismatch (additionalProperties: false).
    property-naming-strategy: SNAKE_CASE
  lifecycle:
    # decision: D00-3 — graceful shutdown timeout per master §5.11; Compose stop_grace_period is longer
    timeout-per-shutdown-phase: 30s
  # decision: D00-4, D00-8 — docs/step_00_foundations.md#decisions-and-outputs
  # Runtime queries use ledger_app; Flyway migrates as ledger_owner. Passwords have no defaults (fail fast).
  datasource:
    url: jdbc:postgresql://${ZS_DB_HOST:localhost}:${ZS_DB_PORT:5432}/ledger
    username: ledger_app
    password: ${ZS_LEDGER_APP_DB_PASSWORD}
  flyway:
    user: ledger_owner
    password: ${ZS_LEDGER_OWNER_DB_PASSWORD}
    # Tolerate a slow database instead of relying only on Compose start ordering.
    connect-retries: 10
  # decision: D04-2 — docs/step_04_kafka_pipeline.md#decisions-and-outputs (master §5.4 common settings)
  # Every value is set explicitly even where it matches a default, so a framework default cannot change the pipeline's
  # behaviour silently. isolation.level is read_committed (harmless without producer transactions) and auto-commit is
  # off because offsets are committed by the listener only after the apply transaction commits.
  kafka:
    bootstrap-servers: ${ZS_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ledger-apply
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Only used to publish dead-letter records (S04-T03); set explicitly for the same reason as the consumer.
      acks: all
      properties:
        enable.idempotence: true
    listener:
      # Offsets are acknowledged by the listener after the database commit, never by the container on a timer.
      ack-mode: manual
      type: batch

ledger:
  apply:
    # decision: D02-4 — docs/step_02_ledger_core.md#decisions-and-outputs (master §5.11 timeouts)
    lock-timeout: 2s
    statement-timeout: 5s
    # decision: D02-4 — jittered exponential backoff, transient SQLSTATEs only
    max-attempts: 10
    backoff-min: 100ms
    backoff-max: 5s
    # decision: D02-3 — per-order mode by default; S04 chooses the batch size, revisited by SP1 (D02-10)
    default-batch-size: 1
  api:
    # decision: D02-7 — docs/step_02_ledger_core.md#decisions-and-outputs
    # Changelog paging. The ceiling is the master §5.6 proposal of 500 rows per page; the default keeps an
    # unparameterised call small. Assertions read these values rather than hard-coding them.
    default-page-size: 100
    max-page-size: 500
    # decision: D02-8 — operational reads (invariants, verify) scan, so they raise the per-transaction statement
    # timeout above the global apply limit of 5s (master §0.3 C19). Chosen against the P4 targets in master §6.2:
    # invariants over 1M changelog rows <= 10s and verify over 10,000 rows <= 2s, with headroom on a busy database.
    # The global statement-timeout is unchanged; this applies only inside the operational read transaction.
    operational-statement-timeout: 15s
    # decision: D02-8 — verify streams the changelog in sequence order at this fetch size, so a very large entity is
    # never materialized in full.
    verify-fetch-size: 500

# decision: D03-4 — docs/step_03_order_service_outbox.md#decisions-and-outputs
# Static bearer tokens per role (master §5.11). No defaults: a service started without them authenticates nobody.
zs:
  auth:
    writer-tokens: ${ZS_WRITER_TOKENS:}
    reader-token: ${ZS_READER_TOKEN:}
    admin-token: ${ZS_ADMIN_TOKEN:}

server:
  # decision: D00-3 — docs/step_00_foundations.md#decisions-and-outputs (ports per master §4.6 topology)
  port: 8082

management:
  endpoints:
    web:
      exposure:
        # decision: D00-6 — actuator HTTP exposure limited to health
        include: health
  otlp:
    metrics:
      export:
        # decision: D00-6, D00-7 — Micrometer OTLP push is the single metrics exporter (the agent exports traces only)
        url: ${ZS_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 10s
