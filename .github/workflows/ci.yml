# decision: D00-5 — docs/step_00_foundations.md#decisions-and-outputs (action versions: D00-1)
# Jobs select test layers by JUnit tag (D00-10). No image publishing here: images publish on tags only,
# from the tag workflow owned by S09-T07 (master §0.3 O4). No retries or continue-on-error around tests.
name: ci

on:
  push:
  pull_request:
  # Nightly e2e. GitHub runs schedules only on the default branch and may disable them in inactive repositories.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + unit
    runs-on: ubuntu-24.04
    # Target ≤ 10 min for push and pull request (master §10.3).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-test-reports
          path: "**/build/reports/tests/"

  integration:
    name: integration (Testcontainers)
    needs: build
    runs-on: ubuntu-24.04
    # Target ≤ 15 min on merge to main (master §10.3).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # decision: D02-11 — the nightly schedule runs the full-size concurrency stress (master §8.2); pushes and
      # pull requests run the reduced size so the job stays inside the ≤ 10 min target (master §10.3).
      # The nightly run adds -i so the harness's own ZS-STRESS line (size, threads, orders, retry counts) reaches the
      # log: without it System.out is suppressed and the run proves only that the flag was passed, not that it was read.
      - run: ./gradlew integrationTest ${{ github.event_name == 'schedule' && '-Pzs.stress.size=full -i' || '' }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-reports
          path: "**/build/reports/tests/"

  e2e:
    name: e2e (Compose)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    # Target ≤ 20 min nightly (master §10.3).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Generate throwaway .env
        # decision: D00-8 — same generation script as local use; values are masked and die with the runner.
        # Never print `docker compose config` here: it shows interpolated secrets.
        run: |
          tools/dev/generate-env.sh
          while IFS='=' read -r name value; do
            if [[ "$name" =~ ^[A-Z0-9_]+$ && -n "$value" ]]; then echo "::add-mask::$value"; fi
          done < .env
      - name: Build service jars and agent
        run: ./gradlew assemble
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: Run e2e tests
        # Until S05 adds scenarios the tag selects no tests (reported by the build); the health wait above is the check.
        run: ./gradlew e2eTest
      - name: Dump logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
