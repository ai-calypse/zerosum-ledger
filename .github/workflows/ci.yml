# decision: D00-5 — docs/step_00_foundations.md#decisions-and-outputs (action versions: D00-1)
# Jobs select test layers by JUnit tag (D00-10). No image publishing here: images publish on tags only,
# from the tag workflow owned by S09-T07 (master §0.3 O4). No retries or continue-on-error around tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly e2e. GitHub runs schedules only on the default branch and may disable them in inactive repositories.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + unit
    runs-on: ubuntu-24.04
    # Target ≤ 10 min for push and pull request (master §10.3).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build
      - name: Summarize executed tests
        if: always()
        run: python3 .github/scripts/test-summary.py test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-test-reports
          path: "**/build/reports/tests/"

  integration-tests:
    name: Integration / ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-24.04
    # Separate the slow service suites so one serial job cannot exceed its budget.
    # Each group still runs against real PostgreSQL/Kafka Testcontainers.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ledger
            tasks: ':services:ledger-service:integrationTest'
          - group: instruments
            tasks: ':services:instrument-service:integrationTest'
          - group: orders
            tasks: ':services:order-service:integrationTest'
          - group: supporting modules
            tasks: 'integrationTest -x :services:ledger-service:integrationTest -x :services:instrument-service:integrationTest -x :services:order-service:integrationTest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # decision: D02-11 — the nightly schedule runs the full-size concurrency stress (master §8.2); pushes and
      # pull requests run the reduced size so the job stays inside the ≤ 10 min target (master §10.3).
      # The nightly run adds -i so the harness's own ZS-STRESS line (size, threads, orders, retry counts) reaches the
      # log: without it System.out is suppressed and the run proves only that the flag was passed, not that it was read.
      - run: ./gradlew ${{ matrix.tasks }} ${{ github.event_name == 'schedule' && '-Pzs.stress.size=full -i' || '' }}
      - name: Summarize executed tests
        if: always()
        run: python3 .github/scripts/test-summary.py integrationTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports-${{ strategy.job-index }}
          path: "**/build/reports/tests/"

  integration:
    name: integration (Testcontainers)
    if: always()
    needs: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every integration group to pass
        env:
          RESULT: ${{ needs.integration-tests.result }}
        run: test "$RESULT" = success

  e2e:
    name: e2e (Compose)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    # Target ≤ 20 min nightly (master §10.3).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Generate throwaway .env
        # decision: D00-8 — same generation script as local use; values are masked and die with the runner.
        # Never print `docker compose config` here: it shows interpolated secrets.
        run: |
          tools/dev/generate-env.sh
          while IFS='=' read -r name value; do
            if [[ "$name" =~ ^[A-Z0-9_]+$ && -n "$value" ]]; then echo "::add-mask::$value"; fi
          done < .env
      - name: Build service jars and agent
        run: ./gradlew assemble
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: Run e2e tests
        # MoneyPathE2ETest drives the money path against this stack: order API -> outbox -> Kafka -> ledger apply,
        # asserting balances, the zero-sum property, the changelog link back to the order and the ledger invariants.
        # It reads credentials from the .env generated above rather than from the environment, because nothing here
        # exports .env into the Gradle JVM.
        run: ./gradlew e2eTest
      - name: Summarize executed tests
        if: always()
        run: python3 .github/scripts/test-summary.py e2eTest
      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-reports
          path: "**/build/reports/tests/"
      - name: Dump logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
