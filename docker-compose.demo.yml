# Demo overlay — publishes the simulated providers so they can be driven from the host.
#
# The default docker-compose.yml deliberately keeps fake-providers on the internal network with no published port
# (master §4.6): it simulates an external payment provider, and an external provider is not something the host should
# be able to reach directly. That posture stays the default. This overlay makes it opt-in, for a live walkthrough:
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build --wait
#
# Then, from the host:
#   curl -s localhost:8090/fakecard/v1/charges -H 'Content-Type: application/json' \
#     -d '{"client_reference":"demo-1","instrument_token":"tok_card_ok","amount_minor":10000,"currency":"USD"}'
#   curl -s localhost:8090/fakebank/v1/payouts -H 'Content-Type: application/json' \
#     -d '{"client_reference":"demo-2","destination_token":"tok_bank_return_R01","amount_minor":25000,"currency":"USD"}'
#   curl -s 'localhost:8090/fakebank/v1/payouts?client_reference=demo-2'   # watch PENDING -> SETTLED -> RETURNED
#
# Bound to 127.0.0.1, like every other published port here, so nothing is exposed beyond this machine.
services:
  fake-providers:
    ports:
      - "127.0.0.1:8090:8090"

  # decision: S09 — one origin for the whole system.
  #
  # The Explorer is served by ledger-service under a Content-Security-Policy of `connect-src 'self'`. That policy is
  # deliberate: a page that rendered hostile input would have nowhere to send a reader token. It also means the page
  # structurally cannot call instrument-service on another port. Weakening the CSP or opening CORS on the money
  # services would trade a trust boundary (TB1) for a convenience; a proxy removes the problem instead, because every
  # service then answers under one origin and `connect-src 'self'` stays exactly as strict.
  #
  # Opt-in, like the rest of this overlay. The default topology keeps these services on the internal network.
  proxy:
    # decision: D00-1 — pinned by digest, like every other image here.
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Answered by nginx itself, so the proxy reports on its own readiness rather than on whichever upstream is
      # slowest to start.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      ledger-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      instrument-service:
        condition: service_healthy
      fake-providers:
        condition: service_healthy
