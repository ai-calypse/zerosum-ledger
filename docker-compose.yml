# decision: D00-3 — docs/step_00_foundations.md#decisions-and-outputs (image tags and digests: D00-1)
# Commands: `docker compose up -d --wait` (default profile), `docker compose --profile chaos up -d --wait`
# (adds toxiproxy), `docker compose down -v` (reset all data; init scripts only run on an empty volume).
# Extension rule (D00-3): later steps add containers or settings with trace comments in their own register;
# changing an existing D00-3 choice needs a change request.
name: zerosum-ledger

# decision: D00-3 — settings shared by the four service containers
x-service: &service
  depends_on:
    postgres:
      condition: service_healthy
    # Recorded for S04: services will consume Kafka. otel-lgtm is deliberately not a dependency.
    kafka:
      condition: service_healthy
  # Covers spring.lifecycle.timeout-per-shutdown-phase (30 s, master §5.11) plus JVM exit.
  stop_grace_period: 40s
  restart: "no"

# decision: D00-6 — telemetry wiring; the agent itself is attached in services/Dockerfile
x-service-env: &service-env
  ZS_DB_HOST: postgres
  ZS_DB_PORT: "5432"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  ZS_OTLP_METRICS_URL: http://otel-lgtm:4318/v1/metrics
  # service.version stays a dev marker until S09-T07 versions images on tags.
  OTEL_RESOURCE_ATTRIBUTES: service.version=0.0.0-dev,deployment.environment.name=local

x-service-healthcheck: &service-healthcheck
  interval: 5s
  timeout: 5s
  retries: 24
  start_period: 30s

services:
  postgres:
    # decision: D00-1
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    # decision: D00-3 — pg_stat_statements preloaded via command-line server settings (master §0.3 O12)
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ZS_POSTGRES_SUPERUSER_PASSWORD:?set ZS_POSTGRES_SUPERUSER_PASSWORD in .env (tools/dev/generate-env.sh)}
      # decision: D00-4 — role passwords, read only by infra/postgres/init.sh
      ZS_ORDERS_OWNER_DB_PASSWORD: ${ZS_ORDERS_OWNER_DB_PASSWORD:?set ZS_ORDERS_OWNER_DB_PASSWORD in .env}
      ZS_ORDERS_APP_DB_PASSWORD: ${ZS_ORDERS_APP_DB_PASSWORD:?set ZS_ORDERS_APP_DB_PASSWORD in .env}
      ZS_LEDGER_OWNER_DB_PASSWORD: ${ZS_LEDGER_OWNER_DB_PASSWORD:?set ZS_LEDGER_OWNER_DB_PASSWORD in .env}
      ZS_LEDGER_APP_DB_PASSWORD: ${ZS_LEDGER_APP_DB_PASSWORD:?set ZS_LEDGER_APP_DB_PASSWORD in .env}
      ZS_INSTRUMENTS_OWNER_DB_PASSWORD: ${ZS_INSTRUMENTS_OWNER_DB_PASSWORD:?set ZS_INSTRUMENTS_OWNER_DB_PASSWORD in .env}
      ZS_INSTRUMENTS_APP_DB_PASSWORD: ${ZS_INSTRUMENTS_APP_DB_PASSWORD:?set ZS_INSTRUMENTS_APP_DB_PASSWORD in .env}
      ZS_FAKEPROVIDERS_OWNER_DB_PASSWORD: ${ZS_FAKEPROVIDERS_OWNER_DB_PASSWORD:?set ZS_FAKEPROVIDERS_OWNER_DB_PASSWORD in .env}
      ZS_FAKEPROVIDERS_APP_DB_PASSWORD: ${ZS_FAKEPROVIDERS_APP_DB_PASSWORD:?set ZS_FAKEPROVIDERS_APP_DB_PASSWORD in .env}
      ZS_VERIFIER_DB_PASSWORD: ${ZS_VERIFIER_DB_PASSWORD:?set ZS_VERIFIER_DB_PASSWORD in .env}
      ZS_STATS_DB_PASSWORD: ${ZS_STATS_DB_PASSWORD:?set ZS_STATS_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      # decision: D00-4 — init.sh runs once on an empty volume and executes /zs/postgres/init.sql
      - ./infra/postgres:/zs/postgres:ro
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # TCP check: the temporary server used while init scripts run listens on the socket only, so a
      # half-initialized database never reports healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
    stop_grace_period: 30s
    restart: "no"

  kafka:
    # decision: D00-1
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL for the Compose network, HOST for clients on the host, CONTROLLER for KRaft.
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Fixed cluster ID so volumes stay reproducible.
      CLUSTER_ID: ZeroSumLedgerKRaft00Aw
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker: internal topics cannot replicate.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are provisioned explicitly by S04-T01.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      # The bundled CLI inherits KAFKA_HEAP_OPTS; give it a small heap so it fits beside the broker.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
    stop_grace_period: 30s
    restart: "no"

  otel-lgtm:
    # decision: D00-1
    image: grafana/otel-lgtm:0.33.0@sha256:475319e883b66594d1a2f22ef168c2459802bb94548e6f25d9782bd5f5c19a3a
    # decision: D07-2, D07-3 (change request CR-S07-01 to D00-3 — adds mounts to this service).
    # Dashboards and alert rules are provisioned from the repository, read-only. A dashboard that exists only in
    # someone's browser cannot be reviewed and dies with the container, so M12(b) would rest on an unreproducible
    # screenshot.
    volumes:
      # grafana/otel-lgtm runs Grafana with homepath /otel-lgtm/grafana, so it reads conf/provisioning — NOT
      # /etc/grafana/provisioning. Mounting the latter looked right, the files were visibly present in the container,
      # and Grafana ignored them completely: both dashboard UIDs returned 404 and zero alert rules provisioned.
      # Grafana scans these directories for FILES, not subdirectories. Mounting a folder made it log
      # "file has invalid suffix 'zerosum' (.yaml,.yml,.json accepted), skipping" for alerting, and skip the
      # dashboard provider entirely. The provider and rules files are therefore mounted individually, and the
      # dashboard JSON directory is mounted where the provider's `path` points.
      - ./infra/grafana/provisioning/dashboards/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/zerosum.yaml:ro
      - ./infra/grafana/provisioning/dashboards/zerosum:/otel-lgtm/grafana/conf/provisioning/dashboards/zerosum:ro
      - ./infra/grafana/provisioning/alerting/rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/zerosum-rules.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"
      # Local-only OTLP ports (D00-3 exception): host-run spikes and tools export here.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
    restart: "no"

  toxiproxy:
    # decision: D00-1
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    profiles: [chaos]
    ports:
      - "127.0.0.1:8474:8474"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
    restart: "no"

  # decision: D00-3, D00-6 — service containers (S00-T08). Build the jars and agent first: `./gradlew assemble`.
  order-service:
    <<: *service
    build:
      context: services/order-service
      dockerfile: ../Dockerfile
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: order-service
      # decision: D04-2 — the broker inside the Compose network. application.yml defaults to localhost:9092
      # for running outside Docker; inside a container localhost is the container itself, so without this the
      # producer and consumer dial themselves, no topics are created and the outbox never drains.
      ZS_KAFKA_BOOTSTRAP: kafka:29092
      # decision: D03-4 — static per-role tokens. Without these the container authenticates nobody:
      # the variables existed in .env.example from S03-T03 but were never passed to the services,
      # so every /v1 call to the deployed stack failed while the container reported healthy.
      ZS_WRITER_TOKENS: ${ZS_WRITER_TOKENS:?set ZS_WRITER_TOKENS in .env}
      ZS_READER_TOKEN: ${ZS_READER_TOKEN:?set ZS_READER_TOKEN in .env}
      ZS_ADMIN_TOKEN: ${ZS_ADMIN_TOKEN:?set ZS_ADMIN_TOKEN in .env}
      ZS_ORDERS_OWNER_DB_PASSWORD: ${ZS_ORDERS_OWNER_DB_PASSWORD:?set ZS_ORDERS_OWNER_DB_PASSWORD in .env}
      ZS_ORDERS_APP_DB_PASSWORD: ${ZS_ORDERS_APP_DB_PASSWORD:?set ZS_ORDERS_APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    deploy:
      resources:
        limits:
          memory: 768M

  ledger-service:
    <<: *service
    build:
      context: services/ledger-service
      dockerfile: ../Dockerfile
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: ledger-service
      # decision: D04-2 — the broker inside the Compose network. application.yml defaults to localhost:9092
      # for running outside Docker; inside a container localhost is the container itself, so without this the
      # producer and consumer dial themselves, no topics are created and the outbox never drains.
      ZS_KAFKA_BOOTSTRAP: kafka:29092
      # decision: D03-4 — static per-role tokens. Without these the container authenticates nobody:
      # the variables existed in .env.example from S03-T03 but were never passed to the services,
      # so every /v1 call to the deployed stack failed while the container reported healthy.
      ZS_WRITER_TOKENS: ${ZS_WRITER_TOKENS:?set ZS_WRITER_TOKENS in .env}
      ZS_READER_TOKEN: ${ZS_READER_TOKEN:?set ZS_READER_TOKEN in .env}
      ZS_ADMIN_TOKEN: ${ZS_ADMIN_TOKEN:?set ZS_ADMIN_TOKEN in .env}
      ZS_LEDGER_OWNER_DB_PASSWORD: ${ZS_LEDGER_OWNER_DB_PASSWORD:?set ZS_LEDGER_OWNER_DB_PASSWORD in .env}
      ZS_LEDGER_APP_DB_PASSWORD: ${ZS_LEDGER_APP_DB_PASSWORD:?set ZS_LEDGER_APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    deploy:
      resources:
        limits:
          memory: 768M

  instrument-service:
    <<: *service
    build:
      context: services/instrument-service
      dockerfile: ../Dockerfile
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: instrument-service
      # decision: D05-1 — the providers are other containers, not this one. The application.yml defaults are
      # localhost:8090 for local runs; inside the network that would make instrument-service call itself, which is
      # the same class of defect as a localhost broker bootstrap: invisible to every test, fatal in the stack.
      ZS_FAKECARD_BASE_URL: http://fake-providers:8090
      ZS_FAKEBANK_BASE_URL: http://fake-providers:8090
      ZS_INSTRUMENTS_OWNER_DB_PASSWORD: ${ZS_INSTRUMENTS_OWNER_DB_PASSWORD:?set ZS_INSTRUMENTS_OWNER_DB_PASSWORD in .env}
      ZS_INSTRUMENTS_APP_DB_PASSWORD: ${ZS_INSTRUMENTS_APP_DB_PASSWORD:?set ZS_INSTRUMENTS_APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    deploy:
      resources:
        limits:
          memory: 768M

  fake-providers:
    <<: *service
    build:
      context: services/fake-providers
      dockerfile: ../Dockerfile
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: fake-providers
      ZS_FAKEPROVIDERS_OWNER_DB_PASSWORD: ${ZS_FAKEPROVIDERS_OWNER_DB_PASSWORD:?set ZS_FAKEPROVIDERS_OWNER_DB_PASSWORD in .env}
      ZS_FAKEPROVIDERS_APP_DB_PASSWORD: ${ZS_FAKEPROVIDERS_APP_DB_PASSWORD:?set ZS_FAKEPROVIDERS_APP_DB_PASSWORD in .env}
    # Internal only (master §4.6): reachable on the Compose network, no published port.
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres-data:
  kafka-data:
