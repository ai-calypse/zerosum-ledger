# decision: D05-13 — docs/step_05_instruments_fake_providers.md#decisions-and-outputs
# The instrument-service API. S05-T08 starts this file with the attempt read and cancel operations; S05-T09 adds
# instrument registration, S05-T10 the payout run and S05-T11 the webhook receiver, each owned by its own decision.
# Conventions follow docs/zerosum_ledger_mvp_plan.md#rest-apis: every path is under /v1, every error is
# application/problem+json (RFC 9457) with a stable `code`, and authenticated operations return 401 without a valid
# token and 403 for the wrong role (§0.3 C9).
openapi: 3.1.0
info:
  title: ZeroSum instrument-service API
  version: "1.0.0"
  description: |
    Payment attempts and the providers behind them.

    **Attempt history is the audit trail.** A status is never overwritten in place: every change appends a row to the
    attempt's transition history with the cause that produced it, so "why is this attempt in `NEEDS_REVIEW`" is
    answered by reading rows rather than by correlating logs. The read operation returns that history in sequence
    order.

    **What is not here.** The instrument token is never returned: it is the one field on an attempt that identifies a
    payment instrument, and an endpoint that returned it would put it in every client log (D00-8).
servers:
  - url: http://localhost:8083
    description: Local Compose topology

security:
  - bearerAuth: []

paths:
  /v1/payment-attempts/{attempt_id}:
    get:
      operationId: getPaymentAttempt
      summary: One attempt with its transition history
      description: |
        Requires the **reader** role, which writer and admin tokens also satisfy.

        Returns the attempt as it stands plus every status it has been through, in `seq` order. History is
        append-only and numbered per attempt, so the sequence is the order the statuses actually happened in.
      tags: [payment-attempts]
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: The attempt and its history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/payment-attempts/{attempt_id}/cancel:
    post:
      operationId: cancelPaymentAttempt
      summary: Cancel an attempt that has not been submitted
      description: |
        Requires the **admin** role: a cancellation changes money state, so it is not a reader operation.

        Cancellation is allowed **only from `CREATED`** (master §5.11). Anything else is a `not_cancellable` conflict
        whose detail names the status the attempt is actually in — the caller's next step differs, since an attempt
        already `SUBMITTING` may still decline on its own, while one already `SUCCEEDED` has moved money and needs a
        refund rather than a cancellation.

        A cancel racing a submit is settled by the optimistic version guard rather than by the status check above:
        exactly one of them wins, and the loser gets the same conflict with the current status.
      tags: [payment-attempts]
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Cancelled. The body is the attempt, now `CANCELLED`, with the cancellation in its history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/instrument-tokens:
    post:
      operationId: registerInstrumentToken
      summary: Register the instrument an entity's money moves through
      description: |
        Requires the **writer** role: registering an instrument decides where a rider's money will be taken from,
        which is a money operation rather than a read.

        **Re-registration replaces the token for future attempts only.** An attempt copies the token when it is
        created, so a charge already on its way keeps the instrument it was submitted with, and a refund goes back
        to the card that paid rather than to whichever card was registered last.

        The token is never returned, here or anywhere else: it is the one field that identifies a payment
        instrument, and echoing it would put it in every client log (D00-8).
      tags: [instruments]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentRegistration' }
      responses:
        '200':
          description: Registered. The body repeats what was registered, without the token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredInstrument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/webhooks/{provider}:
    post:
      operationId: receiveProviderWebhook
      summary: A signed provider webhook
      description: |
        **Authenticated by signature, not by bearer token.** A provider holds no token of ours; it holds the shared
        secret. `ZS-Signature: t=<unix seconds>,v1=<hex>` is an HMAC-SHA256 over `<t>.<raw body>`, and the timestamp
        must be within **300 seconds** (master §5.11, TB2). Both the current and the previous secret are accepted, so
        a rotation does not require restarting the two sides together. A signature that does not verify is a `400`
        and **writes nothing**.

        **Recorded before applied.** The provider event is inserted first, keyed by the provider's own `event_id`,
        and the resulting transition follows in the same transaction. A `2xx` therefore means *durably recorded*, and
        it is returned only after the commit — so the provider's redelivery is driven by a real failure rather than
        by our bookkeeping. A redelivered event is recorded once and applied once, because the dedupe is the table's
        primary key rather than a check.

        **`disposition` says what the event did**, and several of them are `200` on purpose:

        | `disposition` | Meaning |
        |---|---|
        | `applied` | The transition was applied; its payment event is on the outbox. |
        | `duplicate` | Already recorded by an earlier delivery. Nothing further happened. |
        | `ignored_stale` | Non-advancing: the attempt is already at or past the status claimed (master §5.10). |
        | `ahead_of_state` | The event outran our state. Recorded, then resolved by provider lookup, applying the intermediate transitions in order so each payment event is emitted exactly once (§0.3 C21). |
        | `illegal` | The attempt's state machine has no such move. Recorded and counted rather than applied — and still `2xx`, because an event we can never apply would otherwise be redelivered for ever. |
        | `unmatched` | No attempt has that `client_reference`. Recorded with no attempt attached, so it stays visible to reconciliation. |
      tags: [webhooks]
      # No bearer token: the HMAC is the authentication for this operation.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: The provider whose adapter verifies and parses the body, for example `fakecard`.
          schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$' }
      requestBody:
        required: true
        description: The provider's own event payload, capped at 64 KB (master §5.11).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderWebhook' }
      responses:
        '200':
          description: Recorded, and applied if the transition table said so.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAck' }
        '400':
          description: The signature or timestamp did not verify, or the body is not a payload this provider sends.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: The body is larger than the 64 KB cap.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/reconciliation-runs:
    post:
      operationId: createReconciliationRun
      summary: Reconcile one provider's closed settlement day
      description: |
        Requires the **admin** role: a run books the day's settlement, which moves money.

        Idempotent twice over. The `Idempotency-Key` replays a repeated request (D03-3), and the run identity
        `(provider, report_date)` means a day is reconciled **once** however many callers ask — a second caller
        arriving with a different key receives the existing run rather than booking the settlement again.

        A matching report produces one `SETTLEMENT_RECEIVED` event per currency, carrying the report's totals **as
        reported**. Where the report disagrees with our attempts the difference is recorded as a typed break and left
        as a residual on the provider's clearing account, never adjusted away.
      tags: [reconciliation]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconciliationRequest' }
      responses:
        '201':
          description: Reconciled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationRun' }
        '200':
          # Quoted: an unquoted `key: value` inside a plain scalar reads as a nested mapping and fails to parse.
          description: 'A replay of a run that already exists, carrying the `Idempotent-Replayed` header.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The day has not closed yet. Nothing is persisted; retry on the next cycle.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The key was reused with a different request, the provider publishes no reports, or the
            report settles a currency outside the allow-list.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: The provider could not be reached, or the database is unreachable. Nothing is persisted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/payout-runs:
    post:
      operationId: createPayoutRun
      summary: Pay every eligible driver what the ledger says they are owed
      description: |
        Requires the **writer** role, and an `Idempotency-Key`: this is the operation that sends money out, and a
        retried POST without a key would pay every driver twice. The stored run **is** the idempotency record
        (D03-3) — the same key with the same body replays it, the same key with a different body is
        `idempotency_key_reused`.

        **One run, one currency.** A driver owed money in two currencies is paid by two runs, which is what makes
        the amount unambiguous and matches the one-in-flight-payout rule below being per (driver, currency).

        **Order of checks** (D05-7): payouts kill switch → pipeline freshness → per-driver eligibility. A driver is
        eligible when they have a registered instrument at a provider that can disburse, their `payable` balance on
        its normal side is at least the configured minimum, and they have no payout already in flight. The **amount
        is that balance, read from the ledger at that moment** (ADR-0004), and the `as_of_seq` it was read at is
        recorded against the driver's result for audit.

        **At most one in-flight payout per (driver, currency)** — M10(a) — is enforced by the `one_inflight_payout`
        partial unique index, not by a check in this service. Two runs racing for one driver therefore both proceed;
        one inserts and the other is told by the database that it lost, and reports that driver as
        `SKIPPED_IN_FLIGHT`. A losing run is a normal `201`, never an error.

        **Refusals are `409` and are recorded.** `ledger_stale` (M10(c)) means the pipeline staleness — order-service
        outbox age **plus** ledger unapplied age **plus** this service's outbox age — exceeded the 5 s threshold, *or*
        that one of those stages could not be measured at all. Those are one code on purpose: a stage we could not
        read is not a stage we may assume is healthy, and the alternative is paying against balances nobody checked.
        `payouts_disabled` means the kill switch is off. **A refused run creates no payout attempts**, and because
        the refusal is stored under the key, retrying with the *same* key replays the refusal — retry with a fresh
        key once the pipeline has caught up.

        **Accepted is not settled.** A created attempt is submitted to the bank after this response is prepared and
        reaches `PENDING`, emitting `PAYOUT_ACCEPTED`. Settlement and any return arrive later by webhook.
      tags: [payouts]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutRunRequest' }
      responses:
        '201':
          description: The run completed. Every driver it considered is in `results` with the outcome and why.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRun' }
        '200':
          # Quoted: an unquoted `key: value` inside a plain scalar reads as a nested mapping and fails to parse.
          description: 'A replay of a run that already exists, carrying the `Idempotent-Replayed` header.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            Refused, and no payout attempt was created: `ledger_stale` when the pipeline is behind the 5 s threshold
            or could not be measured, `payouts_disabled` when the kill switch is off. The refusal is recorded as a
            run, whose id is in the detail.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The key was reused with a different request, or the currency is outside the allow-list.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/reconciliation-runs/{run_id}/breaks:
    get:
      operationId: listReconciliationBreaks
      summary: The typed breaks a run found
      description: |
        Requires the **reader** role.

        Each break carries its **type**, which is the point: a missing line is chased with the provider, an amount
        mismatch is a fee or rounding question, and a duplicate line is money claimed twice. `OPEN` means a break a
        later settlement cycle may still resolve; `UNEXPLAINED` means one it will not.
      tags: [reconciliation]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BreakType' }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [OPEN, UNEXPLAINED] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: The run's breaks, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReconciliationBreak' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Static per-role bearer token (master §5.11), verified by the shared `libs/auth` module. Reading an attempt
        needs the reader role; cancelling one needs admin.

  parameters:
    AttemptId:
      name: attempt_id
      in: path
      required: true
      description: The attempt's UUID, which is also the client reference sent to the provider.
      schema: { $ref: '#/components/schemas/Uuid' }

  responses:
    BadRequest:
      description: The attempt id is not a UUID, or a registration names an unusable entity, token or provider.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Valid token for the wrong role.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such attempt, or no adapter serves that webhook path.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The attempt is past `CREATED` and can no longer be cancelled.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: The instruments database is unreachable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Uuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

    NullableUuid:
      type: [string, 'null']
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'

    AttemptStatus:
      type: string
      description: |
        The attempt's status. The legal moves between these are the D05-5 transition tables, derived from the master's
        state-machine diagrams; nothing changes a status except the transition service, and only along an arrow those
        tables draw.
      enum: [CREATED, SUBMITTING, PENDING, UNKNOWN, SUCCEEDED, DECLINED, FAILED, SETTLED, RETURNED, CANCELLED, NEEDS_REVIEW]

    AttemptDetail:
      type: object
      additionalProperties: false
      required: [attempt, transitions]
      properties:
        attempt: { $ref: '#/components/schemas/Attempt' }
        transitions:
          type: array
          description: Every status change, in `seq` order.
          items: { $ref: '#/components/schemas/AttemptTransition' }

    Attempt:
      type: object
      additionalProperties: false
      # Nullable fields are not required: whether a null is serialized or omitted is a mapper setting, and pinning
      # the contract to it would break on a Jackson default rather than on a real change. additionalProperties still
      # catches a misnamed or invented field, and the schemas below still constrain these when present.
      required: [attempt_id, kind, status, order_group_id, entity_id, provider, currency, amount_minor,
                 blocked_on_capture, version, created_at, updated_at]
      properties:
        attempt_id: { $ref: '#/components/schemas/Uuid' }
        kind:
          type: string
          enum: [CHARGE, REFUND, PAYOUT]
        status: { $ref: '#/components/schemas/AttemptStatus' }
        order_group_id:
          type: string
          description: The trip or group this attempt belongs to; also the partition key of its payment events.
        source_order_id:
          allOf:
            - $ref: '#/components/schemas/NullableUuid'
          description: The COMMERCE order that triggered a charge or refund. Null for payouts, which come from a run.
        payout_run_id:
          allOf:
            - $ref: '#/components/schemas/NullableUuid'
          description: The payout run that created this attempt. Null for charges and refunds.
        entity_id:
          type: string
          description: The rider or driver whose money this moves, for example `rider:R1`.
        provider:
          type: string
          description: The provider this attempt is submitted to, for example `fakecard`.
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: A positive magnitude; the direction is carried by `kind`.
        provider_ref:
          type: [string, 'null']
          description: The provider's own reference, once it has given one.
        failure_code:
          type: [string, 'null']
          description: Why it was declined, failed or returned. Null while the attempt has not failed.
        blocked_on_capture:
          type: boolean
          description: A refund waiting for its original charge to resolve before it can be submitted.
        version:
          type: integer
          format: int64
          minimum: 0
          description: The optimistic guard. Every status change requires the version read with the attempt.
        created_at:
          type: string
          description: RFC 3339 with a Z offset.
        updated_at:
          type: string
          description: RFC 3339 with a Z offset.

    AttemptTransition:
      type: object
      additionalProperties: false
      required: [seq, to_status, cause, at]
      properties:
        seq:
          type: integer
          minimum: 1
          description: Gapless per attempt, starting at 1.
        from_status:
          oneOf:
            - $ref: '#/components/schemas/AttemptStatus'
            - type: 'null'
          description: Null only for a row written without a prior status.
        to_status: { $ref: '#/components/schemas/AttemptStatus' }
        cause:
          type: string
          description: What produced the change, for example a webhook, a sweeper or the cancel endpoint.
        at:
          type: string
          description: RFC 3339 with a Z offset.

    InstrumentRegistration:
      type: object
      additionalProperties: false
      required: [entity_id, provider, token]
      properties:
        entity_id:
          type: string
          description: The rider or driver whose instrument this is, for example `rider:R1` (D01-5 rule 3).
          pattern: '^(rider|driver|platform|provider):[A-Za-z0-9_-]{1,64}$'
        provider:
          type: string
          description: |
            The provider holding the instrument, for example `fakecard`. Refused when no adapter serves it: a token
            registered for an unknown provider would create attempts that could never be submitted, and the symptom
            would be a rider who was simply never charged.
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        token:
          type: string
          minLength: 1
          description: The provider's own token. A fake magic string in this project; never a card or bank number.

    RegisteredInstrument:
      type: object
      additionalProperties: false
      required: [entity_id, provider]
      properties:
        entity_id: { type: string }
        provider: { type: string }

    ProviderWebhook:
      type: object
      description: |
        One provider event. The bytes are what the signature covers, so this document describes them rather than
        constraining them: the service verifies the raw body first and parses it only afterwards.
      required: [event_id, provider, event_type, provider_ref, client_reference, amount_minor, currency, occurred_at]
      properties:
        event_id:
          type: string
          description: The provider's own event id, and the dedupe key. A redelivery carries the same one.
        provider:
          type: string
          description: Must match the path; a `fakecard` event on the `fakebank` path is refused.
        event_type:
          type: string
          description: The provider's vocabulary, for example `charge.succeeded` or `payout.returned`.
        provider_ref:
          type: string
          description: The provider's reference for the charge, refund or payout this is about.
        client_reference:
          type: string
          description: Our attempt id, as the provider echoed it back.
        amount_minor:
          type: integer
          format: int64
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        failure_code:
          type: [string, 'null']
          description: The decline, failure or return code, for example `R01`. Null for successes.
        occurred_at:
          type: string
          description: RFC 3339, the provider's own timestamp for the event.

    WebhookAck:
      type: object
      additionalProperties: false
      required: [event_id, disposition]
      properties:
        event_id:
          type: string
          description: The provider event id this answer is about.
        disposition:
          type: string
          description: What the D05-5 transition table said to do with it.
          enum: [applied, duplicate, ignored_stale, ahead_of_state, illegal, unmatched]

    BreakType:
      type: string
      description: |
        The kind of disagreement. Each discrepancy the simulator can inject maps to exactly one value (D06-2):
        a missing line to `MISSING_IN_REPORT`, an off-by-one to `AMOUNT_MISMATCH`, a duplicated line to
        `DUPLICATE_LINE`. A single generic "mismatch" would satisfy a test that counts breaks while telling an
        operator nothing about what to do.
      enum: [MISSING_IN_LEDGER, MISSING_IN_REPORT, AMOUNT_MISMATCH, DUPLICATE_LINE, KIND_MISMATCH,
             CURRENCY_MISMATCH, TIMING, LINE_WITHOUT_SUCCESS, REPORT_ARITHMETIC]

    ReconciliationRequest:
      type: object
      additionalProperties: false
      required: [provider, report_date]
      properties:
        provider:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
          description: Must declare the settlement-report capability. In the MVP that is `fakecard` only.
        report_date:
          type: string
          description: The closed simulated day to reconcile, as an ISO date.

    ReconciliationRun:
      type: object
      additionalProperties: false
      required: [run_id, provider, report_date, report_id, status, lines_matched, breaks_found, settled, replayed]
      properties:
        run_id: { $ref: '#/components/schemas/Uuid' }
        provider: { type: string }
        report_date: { type: string }
        report_id: { type: string }
        status:
          type: string
          enum: [COMPLETED, FAILED_VALIDATION]
          description: '`FAILED_VALIDATION` means the report disagreed with its own arithmetic; nothing was booked.'
        lines_matched: { type: integer, minimum: 0 }
        breaks_found: { type: integer, minimum: 0 }
        settled:
          type: boolean
          description: Whether a settlement event was emitted. False for an empty day and for a failed validation.
        replayed:
          type: boolean
          description: True when this run already existed and was returned rather than performed again.

    ReconciliationBreak:
      type: object
      additionalProperties: false
      required: [break_id, break_type, status]
      properties:
        break_id: { type: integer, format: int64 }
        break_type: { $ref: '#/components/schemas/BreakType' }
        status: { type: string, enum: [OPEN, UNEXPLAINED] }
        provider_ref: { type: [string, 'null'] }
        client_reference: { type: [string, 'null'] }
        currency: { type: [string, 'null'] }
        report_gross_minor:
          type: [integer, 'null']
          format: int64
          description: What the report said. Null when the report had no line at all.
        ledger_gross_minor:
          type: [integer, 'null']
          format: int64
          description: What our attempt said. Null when we hold no matching attempt.
        attempt_id: { $ref: '#/components/schemas/NullableUuid' }
        detail: { type: [string, 'null'] }

    PayoutRunRequest:
      type: object
      additionalProperties: false
      required: [currency]
      properties:
        currency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          description: >
            The currency to pay out, from the D01-7 allow-list. Refused rather than normalized: a run keyed on `usd`
            would hash differently from the same run keyed on `USD`, so a caller alternating between them would get
            two runs instead of one replay.

    PayoutRun:
      type: object
      additionalProperties: false
      required: [run_id, currency, status, attempts_created, results, replayed]
      properties:
        run_id: { $ref: '#/components/schemas/Uuid' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        status:
          type: string
          enum: [RUNNING, COMPLETED, REFUSED]
          description: >
            `REFUSED` is only ever seen through the 409 problem, never in a 200 or 201 body. `RUNNING` means a run
            that was interrupted between opening and completing; it is returned only by a replay of that key.
        refusal_code:
          type: [string, 'null']
          description: Why a refused run refused — `ledger_stale` or `payouts_disabled`. Null for a completed run.
        attempts_created:
          type: integer
          minimum: 0
          description: How many payout attempts this run actually inserted. Always 0 for a refused run.
        results:
          type: array
          description: Every driver the run considered, ordered by entity id.
          items: { $ref: '#/components/schemas/PayoutRunResult' }
        replayed:
          type: boolean
          description: True when this run already existed and was returned rather than performed again.

    PayoutRunResult:
      type: object
      additionalProperties: false
      required: [entity_id, outcome]
      properties:
        entity_id:
          type: string
          description: The driver, for example `driver:D1`.
        outcome:
          type: string
          enum: [PAID, SKIPPED_IN_FLIGHT, SKIPPED_BELOW_MINIMUM, SKIPPED_NO_BALANCE, SKIPPED_NO_TOKEN]
          description: |
            What happened to this driver, and each value implies a different fix:

            | `outcome` | Meaning |
            |---|---|
            | `PAID` | A payout attempt was created and submitted to the bank. |
            | `SKIPPED_IN_FLIGHT` | The `one_inflight_payout` index refused a second payout; one is already on its way. |
            | `SKIPPED_BELOW_MINIMUM` | The `payable` balance is under the configured minimum, which also covers zero and driver debt. |
            | `SKIPPED_NO_BALANCE` | The ledger holds no entries for this driver at all. |
            | `SKIPPED_NO_TOKEN` | Registered, but at no provider that can disburse. The fix is a registration, not a bigger balance. |
        amount_minor:
          type: [integer, 'null']
          format: int64
          description: >
            What the driver was owed on the account's normal side when the run read it. Null when no balance was
            read, and present but under the minimum for `SKIPPED_BELOW_MINIMUM`.
        as_of_seq:
          type: [integer, 'null']
          format: int64
          description: The ledger sequence the balance was read at, kept so a payout amount can be traced afterwards.
        attempt_id:
          allOf:
            - $ref: '#/components/schemas/NullableUuid'
          description: The payout attempt this run created. Null for every skipped outcome.

    Problem:
      # RFC 9457, plus the stable `code` the master's conventions require.
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          # The union of both S05-T11 and S06: every code InstrumentApiException can produce. A code the service
          # can emit but the spec omits is a response its own contract denies, and the conformance test checks it.
          enum: [invalid_attempt_id, attempt_not_found, not_cancellable, invalid_registration, unknown_provider,
                 invalid_signature, invalid_webhook, payload_too_large,
                 # decision: D06-4 — reconciliation (S06-T03)
                 idempotency_key_missing, idempotency_key_reused, invalid_report_date,
                 settlement_reports_unsupported, report_not_ready, provider_unavailable, unsupported_currency,
                 reconciliation_run_not_found,
                 # decision: D05-7, D05-11 — payout runs (S05-T10)
                 ledger_stale, payouts_disabled,
                 unauthorized, forbidden, database_unavailable]
          description: Stable machine-readable error code; callers branch on this, never on `title`.
