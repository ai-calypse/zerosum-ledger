# decision: D02-7 — docs/step_02_ledger_core.md#decisions-and-outputs
# The ledger read API. Paths added later by other steps (for example the freshness endpoint, D04-5) are owned by the
# decision that introduces them, not by D02-7. Conventions follow docs/zerosum_ledger_mvp_plan.md#rest-apis: every path
# is under /v1 and every error is application/problem+json (RFC 9457) with a stable `code`.
openapi: 3.1.0
info:
  title: ZeroSum ledger-service read API
  version: "1.0.0"
  description: |
    Read-only views of the ledger: an entity's balances presented on each account's normal side, and its append-only
    changelog.

    **Audit walk (M6 (c)).** A balance is explained by walking back through the changelog: `GET .../balances` returns
    `as_of_seq`, then `GET .../changelog` pages the rows that produced it. Every row carries `order_id` plus the
    `source.system` and `source.idempotency_key` of the money order that caused it, which is the handle for looking the
    order up in order-service. The ledger half of that walk is tested here; the end-to-end walk is verified in S04.

    **Authentication** is declared here but not yet enforced: S03-T03 wires the shared `libs/auth` module into
    ledger-service, and until then the service port stays local-only.
servers:
  - url: http://localhost:8082
    description: Local Compose topology

security:
  - bearerAuth: []

paths:
  /v1/entities/{entity_id}/balances:
    get:
      operationId: getEntityBalances
      summary: Balances for one entity, on each account's normal side
      description: |
        Returns every account this entity holds, with the balance presented on the account's normal side (ADR-0003) and
        the signed value as stored. `as_of_seq` is the entity's last changelog sequence number at the moment the
        balances were read; both come from a single snapshot, so they always agree with each other.

        A later changelog page may contain rows beyond this `as_of_seq`, because applies continue while you read.
      tags: [ledger]
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: The entity's balances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balances' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/entities/{entity_id}/changelog:
    get:
      operationId: getEntityChangelog
      summary: A page of an entity's changelog, in sequence order
      description: |
        Keyset pagination over the `(entity_id, seq)` primary key: pass the previous page's `next_after_seq` as
        `after_seq`. Rows are append-only and sequence numbers are gapless per entity, so pages stay stable while
        applies continue.

        A request past the last sequence number returns an empty page with no `next_after_seq`; it is not a 404.
        Hash-chain fields are not exposed: tamper evidence is reported by the verify endpoint, which is what the S09
        Explorer displays.
      tags: [ledger]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - name: after_seq
          in: query
          required: false
          description: Return rows with a sequence number strictly greater than this. Omit or 0 to start at the beginning.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          description: Maximum rows to return. The server's maximum is configuration (`ledger.api.max-page-size`).
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: A page of changelog rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangelogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/invariants:
    get:
      operationId: getInvariants
      summary: Global ledger invariants from one snapshot
      description: |
        Reports I2 (global per-currency sum is zero), I3 (balances equal the sum of changelog deltas and every running
        balance is correct) and I4 (gapless sequence per entity), plus the unresolved quarantine count and any clearing
        account that has not returned to zero.

        Every figure comes from a single read-only repeatable-read transaction, so they all describe the same state even
        while applies commit. The transaction raises its own statement timeout above the apply limit because these reads
        scan.

        **I5 is not evaluated here.** Verifying every entity's hash chain would rehash the whole changelog and cannot
        meet the audit-read budget on a large ledger, so the response says so explicitly rather than implying I5 passed;
        use the per-entity verify operation, and the S06 verifier for a whole-ledger sweep.

        **This endpoint is operational, not interactive.** A long snapshot on a busy database delays vacuum, so it is
        meant for operators and the verifier rather than for a UI polling loop.
      tags: [ledger]
      responses:
        '200':
          description: The invariant report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invariants' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/entities/{entity_id}/verify:
    post:
      operationId: verifyEntity
      summary: Rebuild an entity's balances from its changelog and verify its hash chain
      description: |
        Streams the entity's changelog in sequence order, recomputes each account's running balance, compares every
        row's stored running balance and the rebuilt totals against the stored account balances, and verifies the hash
        chain (I5). Reports the lowest failing sequence number when several checks fail.

        It writes nothing; POST follows the master's REST table. The changelog is streamed at a bounded fetch size, so a
        very large entity is never materialized in full. If the read exceeds its statement timeout the response is a
        problem with code `operational_read_timeout`, never a `consistent` result.
      tags: [ledger]
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: The verification result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  # decision: D04-5 — docs/step_04_kafka_pipeline.md#decisions-and-outputs
  /v1/freshness:
    get:
      operationId: getFreshness
      summary: How far behind the ledger is
      description: |
        Requires the **reader** role. Reports consumer lag in records and the age of the oldest record the ledger has
        not applied yet.

        **Fails closed.** When lag or age cannot be computed the status is `error` and the numbers are *omitted*, never
        reported as zero. A caller that cannot see a figure refuses; a caller shown a fabricated zero would proceed
        against balances nobody checked.

        The age uses the Kafka record timestamp of the oldest unapplied record, while outbox ages come from their own
        `created_at`, so a caller summing pipeline freshness across stages counts no stage twice.
      tags: [freshness]
      responses:
        '200':
          description: |
            The current lag and age. Also returned with `status: error` when the values could not be computed — the
            request succeeded, the measurement did not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Freshness' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Static per-role bearer token. Enforced once S03-T03 wires `libs/auth` (master §0.3 C9).

  parameters:
    EntityId:
      name: entity_id
      in: path
      required: true
      description: |
        Entity ID such as `rider:R1`. The colon may be sent literally or percent-encoded as `%3A`; both are accepted.
      schema: { $ref: '#/components/schemas/EntityId' }

  responses:
    BadRequest:
      description: Malformed entity ID, cursor or limit.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid token. Declared now, enforced from S03-T03.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Valid token for the wrong role. Declared now, enforced from S03-T03.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such entity.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: The database is unreachable. Never a partial page.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Freshness:
      type: object
      additionalProperties: false
      required: [status, listener_paused, computed_at]
      properties:
        status:
          type: string
          enum: [ok, error]
          description: '`ok` only when every figure below was measured.'
        total_lag_records:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Records behind across all partitions. Absent when the status is `error`.
        partition_lag:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
          description: Lag per partition, so one stuck partition is visible rather than averaged away.
        oldest_unapplied_age_seconds:
          type: [number, "null"]
          minimum: 0
          description: |
            Age of the oldest record not yet applied, from its Kafka record timestamp. Zero when there is no lag.
            Absent when the status is `error`.
        listener_paused:
          type: boolean
          description: Whether the apply listener is paused after an exhausted or unclassified failure.
        computed_at:
          type: string
          format: date-time
        error:
          type: [string, "null"]
          description: Why the measurement failed, when the status is `error`.
    EntityId:
      # decision: D01-5 — rule 3 entity ID pattern and length bound, mirrored from libs/money ValidationLimits
      type: string
      maxLength: 73
      pattern: '^(rider|driver|platform|provider):[A-Za-z0-9_-]{1,64}$'

    CurrencyCode:
      # decision: D01-7 — mirrors libs/money allowed-currencies.txt
      type: string
      enum: [EUR, JPY, KWD, USD]

    AccountCode:
      # decision: D01-6 — the chart of accounts
      type: string
      enum: [receivable, payable, revenue, cash, processing_fees, clearing, payout_clearing]

    Balances:
      type: object
      additionalProperties: false
      required: [entity_id, kind, as_of_seq, accounts]
      properties:
        entity_id: { $ref: '#/components/schemas/EntityId' }
        kind:
          type: string
          enum: [rider, driver, platform, provider]
        as_of_seq:
          type: integer
          format: int64
          minimum: 0
          description: The entity's last changelog sequence number in the snapshot these balances were read from. 0 before its first entry.
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountBalance' }

    AccountBalance:
      type: object
      additionalProperties: false
      required: [account, currency, normal_side, presented_minor, signed_minor]
      properties:
        account: { $ref: '#/components/schemas/AccountCode' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        normal_side:
          type: string
          enum: [DEBIT, CREDIT]
          description: The account's normal side (ADR-0003, D01-6).
        presented_minor:
          type: integer
          format: int64
          description: The balance on the account's normal side; positive means the normal-side direction.
        signed_minor:
          type: integer
          format: int64
          description: The stored signed balance, debit positive and credit negative. Returned alongside the presented value so a caller can reconcile without knowing the chart.

    ChangelogPage:
      type: object
      additionalProperties: false
      required: [entity_id, rows]
      properties:
        entity_id: { $ref: '#/components/schemas/EntityId' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ChangelogRow' }
        next_after_seq:
          type: [integer, 'null']
          format: int64
          description: Pass as `after_seq` for the next page. Absent or null when this is the last page.

    ChangelogRow:
      type: object
      additionalProperties: false
      required: [seq, order_id, account, currency, delta_minor, balance_after_minor, recorded_at, source]
      properties:
        seq: { type: integer, format: int64, minimum: 1 }
        order_id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        account: { $ref: '#/components/schemas/AccountCode' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        delta_minor:
          type: integer
          format: int64
          description: Signed change from this entry, debit positive and credit negative.
        balance_after_minor:
          type: integer
          format: int64
          description: The signed running balance of that account after this entry.
        recorded_at:
          type: string
          description: When the row was written, RFC 3339 with a Z offset.
        source:
          $ref: '#/components/schemas/ChangelogSource'

    ChangelogSource:
      type: object
      additionalProperties: false
      required: [system, idempotency_key]
      description: The money order that caused this row, from its applied-order record (master §0.3 C17). This is the M6 (a) link.
      properties:
        system:
          type: string
          description: The system that produced the order, for example `trip-simulator`.
        idempotency_key:
          type: string
          description: The source idempotency key of the money order.

    Invariants:
      type: object
      additionalProperties: false
      required: [consistent, i2_non_zero_currencies, i3_violations, i4_violations, i5, unresolved_quarantined_count, non_zero_clearing_balances]
      properties:
        consistent:
          type: boolean
          description: True when I2, I3 and I4 all hold. I5 is reported separately and is not part of this flag.
        i2_non_zero_currencies:
          type: array
          description: Currencies whose global balance sum is not zero. Empty means I2 holds.
          items: { $ref: '#/components/schemas/CurrencyCode' }
        i3_violations:
          type: array
          description: Accounts whose balance disagrees with the sum of their deltas, and rows whose running balance is wrong. Empty means I3 holds.
          items: { type: string }
        i4_violations:
          type: array
          description: Entities whose sequence numbers have a gap or do not start at 1. Empty means I4 holds.
          items: { $ref: '#/components/schemas/EntityId' }
        i5:
          $ref: '#/components/schemas/I5Status'
        unresolved_quarantined_count:
          type: integer
          format: int64
          minimum: 0
          description: Quarantine rows an operator has not resolved. Resolved rows are not counted.
        non_zero_clearing_balances:
          type: array
          description: Clearing accounts that have not returned to zero. No age or settlement-cycle filter is applied here; the S06 verifier judges age and break matching (I9).
          items: { $ref: '#/components/schemas/ClearingBalance' }

    I5Status:
      type: object
      additionalProperties: false
      required: [evaluated, reason]
      properties:
        evaluated:
          type: boolean
          description: False on this endpoint. It never claims I5 passed.
        reason:
          type: string
          description: Where I5 is evaluated instead.

    ClearingBalance:
      type: object
      additionalProperties: false
      required: [entity_id, account, currency, signed_minor]
      properties:
        entity_id: { $ref: '#/components/schemas/EntityId' }
        account: { $ref: '#/components/schemas/AccountCode' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        signed_minor:
          type: integer
          format: int64
          description: The stored signed balance, debit positive and credit negative.

    Verification:
      type: object
      additionalProperties: false
      required: [entity_id, consistent, rows_checked]
      properties:
        entity_id: { $ref: '#/components/schemas/EntityId' }
        consistent:
          type: boolean
        rows_checked:
          type: integer
          format: int64
          minimum: 0
          description: Changelog rows streamed and checked.
        first_bad_seq:
          type: [integer, 'null']
          format: int64
          description: The lowest sequence number that failed a check, or null when consistent.
        failure:
          type: [string, 'null']
          enum: [SEQUENCE_BREAK, UNSUPPORTED_FORM_VERSION, BROKEN_LINK, HASH_MISMATCH, RUNNING_BALANCE_MISMATCH, BALANCE_MISMATCH, null]
          description: Which check failed, or null when consistent.
        detail:
          type: [string, 'null']
          description: Human-readable explanation of the failure, or null when consistent.

    Problem:
      # RFC 9457, plus the stable `code` the master's conventions require.
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum: [invalid_entity_id, invalid_cursor, invalid_limit, entity_not_found, unauthorized, forbidden, database_unavailable, operational_read_timeout]
          description: Stable machine-readable error code; callers branch on this, never on `title`.
