# decision: S09 — one origin for the whole system, so the Explorer can reach every service.
#
# The Explorer is served by ledger-service with a Content-Security-Policy of `connect-src 'self'`. That is the right
# policy — it means a page rendering hostile input has nowhere to send a reader token — but it also means the page
# structurally cannot call instrument-service on another port. The alternatives were to weaken the CSP or open CORS
# on the money services; both widen a trust boundary (TB1) to save a click.
#
# A reverse proxy removes the problem instead of trading it away: every service answers under one origin, so
# `connect-src 'self'` stays exactly as strict while the page can reach all of them.
#
# Routes are prefixed by service rather than merged, because every service publishes `/v1/...` and a merged namespace
# would make the route depend on which upstream happened to match first.

worker_processes 1;
events { worker_connections 256; }

http {
  # Docker's embedded DNS, re-resolved rather than cached at startup: a service restarting gets a new address, and a
  # proxy holding the old one fails every request until it is itself restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Never buffer a whole response to disk; these are small JSON documents and one HTML page.
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  server {
    listen 8080;
    server_name _;

    # The Explorer itself, and the ledger API it already calls with unprefixed paths. Keeping ledger unprefixed means
    # the page works identically whether it is opened through this proxy or directly on ledger-service's own port.
    location / {
      set $ledger http://ledger-service:8082;
      proxy_pass $ledger;
    }

    location /v1/ {
      set $ledger http://ledger-service:8082;
      proxy_pass $ledger;
    }

    # Everything else is prefixed. The prefix is stripped before the upstream sees it, so services keep their own
    # documented paths and the OpenAPI files stay true.
    location /orders/ {
      set $orders http://order-service:8081;
      # proxy_pass with a variable ignores the replacement path, so the prefix must be stripped explicitly.
      rewrite ^/orders/(.*)$ /$1 break;
      proxy_pass $orders;
    }

    location /instruments/ {
      set $instruments http://instrument-service:8083;
      # proxy_pass with a variable ignores the replacement path, so the prefix must be stripped explicitly.
      rewrite ^/instruments/(.*)$ /$1 break;
      proxy_pass $instruments;
    }

    # Admin and provider APIs. Internal-only in the default topology; reachable here because this proxy is part of the
    # demo overlay, which is opt-in.
    location /providers/ {
      set $providers http://fake-providers:8090;
      # proxy_pass with a variable ignores the replacement path, so the prefix must be stripped explicitly.
      rewrite ^/providers/(.*)$ /$1 break;
      proxy_pass $providers;
    }

    # Grafana. It needs its root path preserved and websockets for live panels.
    location /grafana/ {
      set $grafana http://otel-lgtm:3000;
      rewrite ^/grafana/(.*)$ /$1 break;
      proxy_pass $grafana;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # A health endpoint for the container's own healthcheck: answered by nginx, so it reports on the proxy rather
    # than on whichever upstream happens to be slowest to start.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
